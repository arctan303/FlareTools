name = "flaretools"
main = "worker/index.js"
compatibility_date = "2026-10-04"
workers_dev = true
routes = [{ pattern = "tools.arcinks.com", custom_domain = true }]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api", "/api/*"]

[[durable_objects.bindings]]
name = "TEXT_ROOMS"
class_name = "TextRoom"

[[durable_objects.bindings]]
name = "TEXT_QUOTAS"
class_name = "TextQuota"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TextRoom", "TextQuota"]

[triggers]
crons = ["*/15 * * * *"]

# D1 stores temporary Mock APIs; text sharing uses Durable Objects.
# To initialize your D1 database:
# 1. Run: npx wrangler d1 create flare-tools-db
# 2. Paste the generated database_id below
# 3. Execute schema: npx wrangler d1 execute flare-tools-db --remote --file=./schema.sql

[[d1_databases]]
binding = "DB"
database_name = "flare-tools-db"
database_id = "38c2e70d-ac68-4f8e-8a30-c6d35aec0b60"
