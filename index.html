    <!-- 阻塞渲染：统一主题初始化，防 FOUC -->
    <script>
      (function(){
        function getThemeMode(){
          try{
            var s=localStorage.getItem('theme_pref');
            if(!s)return 'system';
            if(s==='dark'||s==='light'){
              localStorage.setItem('theme_pref',JSON.stringify({value:s,expires:Date.now()+21600000}));
              return s;
            }
            var d=JSON.parse(s);
            if(d.expires>Date.now()&&(d.value==='system'||d.value==='dark'||d.value==='light'))return d.value;
            localStorage.removeItem('theme_pref');
          }catch(e){}
          return 'system';
        }
        var m=getThemeMode();
        var t=m==='system'?(window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'):m;
        document.documentElement.classList.toggle('dark',t==='dark');
        document.documentElement.dataset.theme=t;
        document.documentElement.style.colorScheme=t;
      })();
    </script>
